<!doctype html>
<!-- Link-preview card. Rendered to public/og.jpg by scripts/og.sh (dev server running). -->
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <script type="module">
      import '@fontsource/playfair-display/latin-500.css'
      import '@fontsource/playfair-display/latin-400-italic.css'
      import '@fontsource/hind/latin-400.css'
      import '../src/styles/tokens.css'
    </script>
    <style>
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #fff; }
      .card { position: relative; width: 1200px; height: 630px; display: grid; grid-template-columns: 1fr 470px; align-items: center; padding: 0 0 0 90px; box-sizing: border-box; }
      h1 { margin: 0; font: 500 118px/0.92 var(--serif); color: var(--sauge); letter-spacing: -0.02em; }
      p { margin: 22px 0 0; font: italic 400 40px/1.2 var(--serif); color: var(--olive); }
      .where { font: 400 28px/1.3 var(--sans); font-style: normal; color: var(--olive-soft); margin-top: 26px; }
      .visual { position: relative; height: 630px; }
      .blob { position: absolute; inset: 60px -40px 40px 40px; background: var(--rose); -webkit-mask: url('../src/assets/blob.svg') center / 100% 100% no-repeat; transform: rotate(-7deg); }
      .photo { position: absolute; inset: 40px 0 60px 30px; -webkit-mask: url('../src/assets/blob.svg') center / 100% 100% no-repeat; background: center / cover no-repeat; }
      .mark { position: absolute; left: 50%; top: 50%; width: 190px; height: 256px; transform: translate(-50%, -50%); color: var(--blanc); }
    </style>
  </head>
  <body>
    <div class="card">
      <div>
        <h1>Léa<br>Detrieux</h1>
        <p>ostéopathe animalier</p>
        <p class="where">À domicile dans le Sud-Gironde</p>
      </div>
      <div class="visual">
        <div class="blob"></div>
        <div class="photo"></div>
        <svg class="mark" viewBox="724 513 1133 1528" aria-hidden="true"><use href="#m"/></svg>
      </div>
    </div>
    <script type="module">
      // Léa's photo when it exists, otherwise her mark on the rose blob
      const photo = '/photos/lea-epagneul-840.jpg'
      const ok = await fetch(photo, { method: 'HEAD' }).then((r) => r.ok && r.headers.get('content-type')?.startsWith('image')).catch(() => false)
      if (ok) {
        document.querySelector('.photo').style.backgroundImage = `url(${photo})`
        document.querySelector('.mark').remove()
      } else {
        const svg = await (await fetch('/src/assets/logo/mark.svg')).text()
        document.querySelector('.mark').outerHTML = svg.replace('<svg ', '<svg class="mark" ')
      }
      await document.fonts.ready
      document.body.dataset.ready = '1'
    </script>
  </body>
</html>
