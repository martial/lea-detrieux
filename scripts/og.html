<!doctype html>
<!-- Link-preview card. Rendered to public/og.jpg by scripts/og.sh (dev server running).
     Same composition as the hero: her name, and her stamp pressed across the rose shape. -->
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <script type="module">
      import '@fontsource/playfair-display/latin-500.css'
      import '@fontsource/playfair-display/latin-600.css'
      import '@fontsource/playfair-display/latin-400-italic.css'
      import '@fontsource/hind/latin-400.css'
      import '../src/styles/tokens.css'
    </script>
    <style>
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #fff; }
      .card { position: relative; width: 1200px; height: 630px; display: grid; grid-template-columns: 1fr 500px; align-items: center; padding: 0 70px 0 90px; box-sizing: border-box; }
      h1 { margin: 0; font: 500 124px/0.92 var(--serif); color: var(--sauge); letter-spacing: -0.02em; }
      p { margin: 18px 0 0; font: italic 400 42px/1.2 var(--serif); color: var(--olive); }
      .where { font: 400 28px/1.3 var(--sans); font-style: normal; color: var(--olive-soft); margin-top: 30px; }
      .visual { position: relative; width: 500px; height: 520px; }
      .blob { position: absolute; left: 24%; top: 0; width: 78%; height: 74%; background: var(--rose); -webkit-mask: url('../src/assets/blob.svg') center / 100% 100% no-repeat; transform: rotate(-7deg); }
      .photo { display: none; position: absolute; inset: 0 0 0 10%; -webkit-mask: url('../src/assets/blob.svg') center / 100% 100% no-repeat; background: center / cover no-repeat; }
      .seal { position: absolute; left: 0; bottom: 0; width: 76%; height: auto; transform: rotate(-8deg); }
      .has-photo .blob { left: 16%; top: 4%; width: 84%; height: 96%; }
      .has-photo .photo { display: block; }
      .has-photo .seal { width: 36%; left: -2%; bottom: -2%; filter: drop-shadow(0 4px 10px rgb(43 52 36 / 0.12)); }
      .seal-paper { fill: var(--blanc); }
      .seal-line { fill: none; stroke: var(--sauge-mark); stroke-width: 1.6; }
      .seal-text { font: 600 10.5px var(--serif); fill: var(--ocre); }
      .seal-dot { fill: var(--sauge-mark); }
      .seal-mark { color: var(--sauge-mark); }
    </style>
  </head>
  <body>
    <div class="card">
      <div>
        <h1>Léa<br>Detrieux</h1>
        <p>ostéopathe animalier</p>
        <p class="where">À domicile dans le Sud-Gironde</p>
      </div>
      <div class="visual">
        <div class="blob"></div>
        <div class="photo"></div>
        <svg class="seal" viewBox="0 0 200 200" aria-hidden="true">
          <defs>
            <path id="seal-top" d="M25 100A75 75 0 0 1 175 100"/>
            <path id="seal-bottom" d="M14 100A86 86 0 0 0 186 100"/>
          </defs>
          <circle cx="100" cy="100" r="97" class="seal-paper"/>
          <circle cx="100" cy="100" r="92" class="seal-line"/>
          <circle cx="100" cy="100" r="68" class="seal-line"/>
          <text class="seal-text" text-anchor="middle"><textPath href="#seal-top" startOffset="50%" textLength="200" lengthAdjust="spacing">LEA DETRIEUX - OSTÉOPATHE ANIMALIER</textPath></text>
          <text class="seal-text" text-anchor="middle"><textPath href="#seal-bottom" startOffset="50%" textLength="226" lengthAdjust="spacing">LEA DETRIEUX - OSTÉOPATHE ANIMALIER</textPath></text>
          <circle cx="20" cy="100" r="1.8" class="seal-dot"/>
          <circle cx="180" cy="100" r="1.8" class="seal-dot"/>
          <g class="seal-mark"></g>
        </svg>
      </div>
    </div>
    <script type="module">
      // Her mark inside the stamp, from the same SVG the site uses
      const mark = await (await fetch('/src/assets/logo/mark.svg')).text()
      const inner = mark.replace(/^[\s\S]*?<g /, '<g ').replace(/<\/svg>\s*$/, '')
      document.querySelector('.seal-mark').outerHTML =
        `<svg class="seal-mark" x="62" y="50" width="76" height="100" viewBox="724 513 1133 1528" fill="currentColor">${inner}</svg>`
      // Léa's photo when it exists (then the stamp goes back to a small corner seal)
      const photo = '/photos/lea-epagneul-840.jpg'
      const ok = await fetch(photo, { method: 'HEAD' }).then((r) => r.ok && r.headers.get('content-type')?.startsWith('image')).catch(() => false)
      if (ok) {
        document.querySelector('.photo').style.backgroundImage = `url(${photo})`
        document.querySelector('.visual').classList.add('has-photo')
      }
      await document.fonts.ready
      document.body.dataset.ready = '1'
    </script>
  </body>
</html>
